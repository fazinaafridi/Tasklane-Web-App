<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Tasklane</title>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap">
<style>
:root {
  --bg: #f2f5f9;
  --sf: #fff;
  --tx: #14213d;
  --mu: #5b6b85;
  --ln: #dce3ee;
  --ac: #0e8f7e;
  --ac2: #e3f4f1;
  --hi: #d64550;
  --md: #b98500;
  --lo: #4c7bd9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1623;
    --sf: #18212f;
    --tx: #e8eef8;
    --mu: #97a5bd;
    --ln: #2a3649;
    --ac: #35c2ae;
    --ac2: #14322f;
    --hi: #f0707a;
    --md: #e8b93a;
    --lo: #7ea2f0;
  }
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font:
    14px/1.45 "Bricolage Grotesque",
    system-ui,
    sans-serif;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: 100%;
}
#sb {
  background: var(--sf);
  border-right: 1px solid var(--ln);
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: auto;
}
.br {
  font-weight: 700;
  font-size: 21px;
  letter-spacing: -0.03em;
  color: var(--ac);
  margin: 0 6px 10px;
}
.sh {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--mu);
  margin: 14px 8px 4px;
}
.pj {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
}
.pj i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ac);
  flex: none;
}
.pj em {
  margin-left: auto;
  font-style: normal;
  color: var(--mu);
}
.pj.on {
  background: var(--ac2);
  font-weight: 600;
}
.me {
  margin-top: auto;
  color: var(--mu);
  font-size: 12px;
  word-break: break-all;
  padding: 8px;
}
main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
}
header {
  padding: 14px 22px 0;
  background: var(--sf);
  border-bottom: 1px solid var(--ln);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
}
h1 {
  font-size: 21px;
  margin: 0;
  letter-spacing: -0.02em;
}
.tools {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
#tabs {
  display: flex;
  gap: 2px;
  width: 100%;
  overflow-x: auto;
}
#tabs button {
  border: 0;
  background: none;
  color: var(--mu);
  padding: 8px 12px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
}
#tabs button.on {
  color: var(--tx);
  border-color: var(--ac);
  font-weight: 600;
}
input,
select,
textarea {
  background: var(--bg);
  border: 1px solid var(--ln);
  border-radius: 8px;
  padding: 7px 10px;
}
.btn {
  border: 1px solid var(--ln);
  background: var(--sf);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
}
.btn.p {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
  font-weight: 600;
}
.btn.d {
  color: var(--hi);
}
#main {
  flex: 1;
  overflow: auto;
  padding: 18px 22px;
}
.hi2 {
  font-size: 26px;
  margin: 0;
  letter-spacing: -0.02em;
}
.grp h3 {
  font-size: 13px;
  color: var(--mu);
  margin: 16px 0 6px;
  font-weight: 600;
}
.grp h3:first-child {
  margin-top: 0;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 8px;
  margin-bottom: 4px;
  cursor: pointer;
  flex-wrap: wrap;
}
.row:hover,
.card:hover {
  border-color: var(--ac);
}
.ti {
  flex: 1;
  min-width: 140px;
}
.dn {
  text-decoration: line-through;
  color: var(--mu);
}
.ex {
  width: 16px;
  flex: none;
  border: 0;
  background: none;
  color: var(--mu);
  cursor: pointer;
  padding: 0;
}
.ck {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid var(--mu);
  background: none;
  cursor: pointer;
  flex: none;
  padding: 0;
}
.ck.on {
  background: var(--ac);
  border-color: var(--ac);
  box-shadow: inset 0 0 0 3px var(--sf);
}
.mu,
.due {
  color: var(--mu);
  font-size: 12px;
}
.od {
  color: var(--hi);
  font-weight: 600;
}
.tag {
  border: 1px solid var(--hi);
  color: var(--hi);
  border-radius: 99px;
  padding: 0 8px;
  font-size: 11px;
}
.tagc {
  background: var(--ac2);
  color: var(--ac);
  border-radius: 99px;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
}
.ev {
  background: var(--ac2);
  color: var(--ac);
  border-radius: 6px;
  padding: 0 6px;
  font-size: 11px;
  font-weight: 600;
}
.pr {
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.pr:before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.High {
  color: var(--hi);
}
.Medium {
  color: var(--md);
}
.Low {
  color: var(--lo);
}
.av {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: inline-grid;
  place-items: center;
  flex: none;
  box-sizing: border-box;
}
.av.e {
  border: 1.5px dashed var(--mu);
  background: none;
  color: var(--mu);
}
.ar {
  width: 100%;
  box-sizing: border-box;
  border-style: dashed;
  margin: 2px 0 6px;
}
.bd {
  display: grid;
  grid-template-columns: repeat(4, minmax(230px, 1fr));
  gap: 12px;
  min-width: 960px;
}
.col {
  border: 1px dashed var(--ln);
  border-radius: 10px;
  padding: 10px;
  min-height: 220px;
}
.col h3 {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin: 0 0 8px;
}
.card {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
  cursor: grab;
}
.cm {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 8px;
}
.ch {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.ch b {
  font-size: 17px;
  min-width: 150px;
  text-align: center;
}
.cg {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-left: 1px solid var(--ln);
  border-top: 1px solid var(--ln);
  min-width: 640px;
}
.cw {
  padding: 6px;
  font-size: 12px;
  color: var(--mu);
  border-right: 1px solid var(--ln);
  border-bottom: 1px solid var(--ln);
  background: var(--sf);
}
.cd {
  min-height: 96px;
  padding: 4px;
  border-right: 1px solid var(--ln);
  border-bottom: 1px solid var(--ln);
  background: var(--sf);
  cursor: pointer;
  overflow: hidden;
}
.cd.oth {
  background: var(--bg);
  color: var(--mu);
}
.cd.tdy .dnum {
  background: var(--ac);
  color: #fff;
}
.dnum {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  border-radius: 11px;
  font-size: 12px;
}
.ci {
  font-size: 12px;
  border-radius: 5px;
  padding: 1px 6px;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: grab;
  background: var(--ln);
}
.ci.event {
  background: var(--ac);
  color: #fff;
}
.ci.x {
  opacity: 0.5;
  text-decoration: line-through;
}
.tg {
  position: relative;
}
.th,
.tr {
  display: flex;
}
.th > b,
.tn {
  width: 170px;
  flex: none;
  position: sticky;
  left: 0;
  background: var(--bg);
  z-index: 2;
  padding: 6px 8px 6px 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  box-sizing: border-box;
  height: 34px;
  line-height: 22px;
}
.th i {
  flex: none;
  text-align: center;
  font-style: normal;
  font-size: 11px;
  color: var(--mu);
  padding: 4px 0;
  border-left: 1px solid var(--ln);
}
.th i small {
  display: block;
  font-size: 9px;
}
.tk {
  position: relative;
  height: 34px;
  border-bottom: 1px solid var(--ln);
}
.bar {
  position: absolute;
  top: 6px;
  height: 22px;
  border-radius: 6px;
  background: var(--ac);
  color: #fff;
  border: 0;
  font-size: 11px;
  padding: 0 8px;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
}
.bar.dn {
  background: var(--mu);
  text-decoration: none;
}
.today {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--hi);
}
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.tile,
.pnl {
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 14px 16px;
}
.tile b {
  font-size: 30px;
  display: block;
  letter-spacing: -0.03em;
}
.tile span {
  color: var(--mu);
}
.two {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.pnl h3 {
  margin: 0 0 8px;
  font-size: 14px;
}
.hb {
  display: grid;
  grid-template-columns: 100px 1fr 24px;
  gap: 10px;
  align-items: center;
  margin: 8px 0;
}
.hb span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hb div {
  background: var(--bg);
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
}
.hb i {
  display: block;
  height: 100%;
}
.hb em {
  font-style: normal;
  text-align: right;
  color: var(--mu);
}
.empty {
  color: var(--mu);
  padding: 30px 0;
  text-align: center;
}
#panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 100%);
  box-sizing: border-box;
  background: var(--sf);
  border-left: 1px solid var(--ln);
  padding: 16px 20px 28px;
  overflow: auto;
  transform: translateX(100%);
  transition:
    transform 0.2s,
    visibility 0.2s;
  visibility: hidden;
  z-index: 20;
  box-shadow: -8px 0 24px rgba(0, 0, 0, 0.15);
}
#panel.open {
  transform: none;
  visibility: visible;
}
.pt {
  width: 100%;
  box-sizing: border-box;
  font-size: 20px;
  font-weight: 600;
  margin: 10px 0 6px;
}
.ph {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.crumb {
  color: var(--ac);
  cursor: pointer;
  font-size: 13px;
}
.fr {
  display: grid;
  grid-template-columns: 104px 1fr;
  gap: 8px;
  align-items: start;
  margin: 10px 0;
}
.fr > span {
  color: var(--mu);
  font-size: 12px;
  padding-top: 9px;
}
.fr select,
.fr input[type="date"],
.fr input[type="datetime-local"] {
  width: 100%;
  box-sizing: border-box;
}
.two2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
h4 {
  margin: 20px 0 6px;
  font-size: 13px;
  color: var(--mu);
}
.hide {
  display: none !important;
}
.cb {
  position: relative;
}
.box {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--ln);
  border-radius: 8px;
  padding: 4px 8px;
}
.box input {
  border: 0;
  background: none;
  flex: 1;
  min-width: 120px;
  padding: 4px 2px;
}
.box input:focus-visible {
  outline: 0;
}
.box:focus-within {
  border-color: var(--ac);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 99px;
  padding: 2px 4px 2px 3px;
  font-size: 13px;
  color: var(--tx);
}
.chip .av {
  width: 22px;
  height: 22px;
}
.chip.inv {
  border-style: dashed;
}
.chip em {
  font-style: normal;
  color: var(--mu);
  font-size: 11px;
}
.chip button,
.x {
  border: 0;
  background: none;
  cursor: pointer;
  color: var(--mu);
  padding: 0 4px;
}
.dd {
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  margin: 4px 0 0;
  padding: 4px;
  list-style: none;
  background: var(--sf);
  border: 1px solid var(--ln);
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  z-index: 10;
}
.dd li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 7px;
  cursor: pointer;
}
.dd li span:last-child {
  color: var(--mu);
  font-size: 12px;
  margin-left: auto;
}
.dd li.act,
.dd li:hover {
  background: var(--ac2);
}
.dd li.none {
  cursor: default;
  color: var(--mu);
}
.invbox {
  margin-top: 8px;
  border: 1px solid var(--ac);
  background: var(--ac2);
  border-radius: 10px;
  padding: 10px 12px;
}
.tb {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  border: 1px solid var(--ln);
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
  padding: 4px;
  background: var(--bg);
}
.tb button {
  border: 0;
  background: none;
  min-width: 30px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
}
.tb button:hover {
  background: var(--ac2);
}
#ed {
  min-height: 100px;
  border: 1px solid var(--ln);
  border-radius: 0 0 8px 8px;
  padding: 10px 12px;
  outline: 0;
}
#ed:focus {
  border-color: var(--ac);
}
#ed:empty:before {
  content: attr(data-ph);
  color: var(--mu);
}
#ed a,
.ir a {
  color: var(--ac);
}
.lk {
  display: flex;
  gap: 6px;
  padding: 6px;
  border: 1px solid var(--ln);
  border-bottom: 0;
  background: var(--bg);
}
.lk input {
  flex: 1;
}
.ir {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border: 1px solid var(--ln);
  border-radius: 8px;
  margin-bottom: 5px;
  background: var(--bg);
}
.ir.o {
  cursor: pointer;
}
.ir .t {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge {
  font-size: 11px;
  border-radius: 5px;
  padding: 1px 6px;
  background: var(--ac2);
  color: var(--ac);
  font-weight: 600;
}
.cmt {
  display: flex;
  gap: 10px;
  margin: 10px 0;
}
.cmt p {
  margin: 2px 0;
  white-space: pre-wrap;
}
.mn {
  color: var(--ac);
  font-weight: 600;
}
.sa {
  width: 100%;
  box-sizing: border-box;
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  background: var(--tx);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 10px;
  z-index: 40;
  max-width: 90%;
}
@media (max-width: 760px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
  }
  #sb {
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--ln);
    padding: 10px;
  }
  #sb nav {
    display: flex;
  }
  .pj {
    white-space: nowrap;
    width: auto;
  }
  #np,
  .me,
  .sh {
    display: none;
  }
  header,
  #main {
    padding-left: 14px;
    padding-right: 14px;
  }
  .fr {
    grid-template-columns: 1fr;
  }
  .fr > span {
    padding-top: 0;
  }
}
</style></head>
<body>
<div class="app">
<aside id="sb"></aside>
<main>
<header>
<h1 id="pt">Home</h1>
<div class="tools">
<input id="q" type="search" placeholder="Search" aria-label="Search tasks">
<select id="who" aria-label="Filter by assignee"></select>
<button class="btn p" id="nw">+ New task</button></div>
<div id="tabs"></div>
</header>
<div id="main"><div class="empty">Loading your workspace…</div></div>
</main>
</div>
<aside id="panel" aria-label="Task details"></aside>
<div id="toast" class="hide" role="status"></div>
<script src="/shim.js"></script>
